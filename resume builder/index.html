<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume Builder Pro</title>

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        body {
            background: #dbe4ee;
        }

        /* NAVBAR */

        .navbar {
            width: 100%;
            background: #111827;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 28px;
        }

        .navbar button {
            padding: 12px 22px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* TEMPLATE SECTION */

        .template-section {
            padding: 30px;
        }

        .template-section h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 35px;
        }

        .templates {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
        }

        .template-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: .3s;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .template-card:hover {
            transform: scale(1.03);
        }

        .template-preview {
            height: 280px;
            display: flex;
        }

        .preview-left {
            width: 35%;
        }

        .preview-right {
            width: 65%;
            background: white;
        }

        .template-card p {
            text-align: center;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        /* MAIN */

        .main {
            display: none;
            gap: 20px;
            padding: 20px;
        }

        /* FORM */

        .form-section {
            width: 35%;
            background: white;
            padding: 20px;
            border-radius: 15px;
            height: fit-content;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-height: 95vh;
            overflow: auto;
        }

        .form-section h2 {
            margin-bottom: 20px;
            color: #2563eb;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            margin-top: 10px;
            color: white;
            background: #2563eb;
            cursor: pointer;
            font-weight: bold;
        }

        .download-btn {
            background: green;
        }

        /* RESUME */

        .resume-wrapper {
            width: 794px;
            background: white;
        }

        .resume {
            width: 794px;
            min-height: 1123px;
            display: flex;
        }

        .left {
            width: 32%;
            padding: 25px;
        }

        .right {
            width: 68%;
            padding: 25px;
        }

        .profile {
            text-align: center;
            margin-bottom: 35px;
        }

        .profile h1 {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .profile h3 {
            font-size: 18px;
            letter-spacing: 2px;
        }

        .profile-photo {
            width: 120px;
            height: 120px;
            margin: auto;
            margin-bottom: 15px;
        }

        .profile-photo img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .section {
            margin-top: 25px;
        }

        .section h2 {
            font-size: 18px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p,
        li {
            font-size: 13px;
            line-height: 1.7;
        }

        ul {
            padding-left: 20px;
        }

        .social-icons {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .social-icons a {
            font-size: 24px;
        }

        /* TEMPLATE 1 */

        .template1 {
            background: #f5f7fb;
        }

        .template1 .left {
            background: linear-gradient(180deg, #1e293b, #0f172a);
            color: white;
        }

        .template1 .right {
            background: white;
        }

        .template1 .profile-photo {
            display: none;
        }

        .template1 .profile h3 {
            color: #93c5fd;
        }

        .template1 .section h2 {
            color: #60a5fa;
            border-bottom: 2px solid #60a5fa;
            padding-bottom: 6px;
        }

        .template1 .right .section h2 {
            color: #111827;
            border-bottom: 2px solid #111827;
        }

        .template1 .right p,
        .template1 .right li {
            color: #374151;
        }

        .template1 .social-icons a {
            color: #60a5fa;
        }

        /* TEMPLATE 2 */

        .template2 .left {
            background: #dce6ef;
            color: #0d3b66;
        }

        .template2 .right {
            background: #f4f4f4;
        }

        .template2 .section h2 {
            color: #0d3b66;
            border-bottom: 2px solid #0d3b66;
            padding-bottom: 6px;
        }

        .template2 .social-icons a {
            color: #0d3b66;
        }

        /* TEMPLATE 3 */

        .template3 .left {
            background: #111827;
            color: white;
        }

        .template3 .right {
            background: white;
        }

        .template3 .profile h3 {
            color: #60a5fa;
        }

        .template3 .section h2 {
            color: #60a5fa;
            border-bottom: 2px solid #60a5fa;
            padding-bottom: 6px;
        }

        .template3 .right .section h2 {
            color: #111827;
            border-bottom: 2px solid #111827;
        }

        .template3 .social-icons a {
            color: #60a5fa;
        }

        /* MOBILE */

        @media(max-width:1200px) {

            .main {
                flex-direction: column;
            }

            .form-section {
                width: 100%;
            }

            .resume-wrapper {
                width: 100%;
                overflow: auto;
            }
        }

        @page {
            size: A4;
            margin: 0;
        }
    </style>

</head>

<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <h1>Resume Builder Pro</h1>

        <button onclick="downloadPDF()">
            Download PDF
        </button>

    </div>

    <!-- TEMPLATE SECTION -->

    <div class="template-section" id="templateSection">

        <h2>Select Resume Template</h2>

        <div class="templates">

            <!-- TEMPLATE 1 -->

            <div class="template-card" onclick="selectTemplate('template1')">

                <div class="template-preview">

                    <div class="preview-left" style="background:linear-gradient(180deg,#1e293b,#0f172a)">
                    </div>

                    <div class="preview-right"></div>

                </div>

                <p>Modern Elegant</p>

            </div>

            <!-- TEMPLATE 2 -->

            <div class="template-card" onclick="selectTemplate('template2')">

                <div class="template-preview">

                    <div class="preview-left" style="background:#dce6ef">
                    </div>

                    <div class="preview-right" style="background:#f4f4f4">
                    </div>

                </div>

                <p>UI/UX Style</p>

            </div>

            <!-- TEMPLATE 3 -->

            <div class="template-card" onclick="selectTemplate('template3')">

                <div class="template-preview">

                    <div class="preview-left" style="background:#111827">
                    </div>

                    <div class="preview-right"></div>

                </div>

                <p>Corporate Premium</p>

            </div>

        </div>

    </div>

    <!-- MAIN -->

    <div class="main" id="main">

        <!-- FORM -->

        <div class="form-section">

            <h2>Edit Resume</h2>

            <div class="form-group">

                <label>Photo</label>

                <input type="file" id="photoInput">

            </div>

            <div class="form-group">

                <label>Name</label>

                <input type="text" id="name" value="Rameshwar Gaud">

            </div>

            <div class="form-group">

                <label>Profession</label>

                <input type="text" id="profession" value="Electrical Engineer">

            </div>

            <div class="form-group">

                <label>Phone</label>

                <input type="text" id="phone">

            </div>

            <div class="form-group">

                <label>Email</label>

                <input type="text" id="email">

            </div>

            <div class="form-group">

                <label>Address</label>

                <input type="text" id="address">

            </div>

            <div class="form-group">

                <label>Skills (Comma Separated)</label>

                <textarea id="skills"></textarea>

            </div>

            <div class="form-group">

                <label>Profile Summary</label>

                <textarea id="summary"></textarea>

            </div>

            <!-- CUSTOM SECTION 1 -->

            <div class="form-group">

                <label>Custom Heading 1</label>

                <input type="text" id="customHeading1">

            </div>

            <div class="form-group">

                <label>Custom Content 1</label>

                <textarea id="customContent1"></textarea>

            </div>

            <!-- CUSTOM SECTION 2 -->

            <div class="form-group">

                <label>Custom Heading 2</label>

                <input type="text" id="customHeading2">

            </div>

            <div class="form-group">

                <label>Custom Content 2</label>

                <textarea id="customContent2"></textarea>

            </div>

            <!-- CUSTOM SECTION 3 -->

            <div class="form-group">

                <label>Custom Heading 3</label>

                <input type="text" id="customHeading3">

            </div>

            <div class="form-group">

                <label>Custom Content 3</label>

                <textarea id="customContent3"></textarea>

            </div>

            <!-- CUSTOM SECTION 4 -->

            <div class="form-group">

                <label>Custom Heading 4</label>

                <input type="text" id="customHeading4">

            </div>

            <div class="form-group">

                <label>Custom Content 4</label>

                <textarea id="customContent4"></textarea>

            </div>

            <!-- CUSTOM SECTION 5 -->

            <div class="form-group">

                <label>Custom Heading 5</label>

                <input type="text" id="customHeading5">

            </div>

            <div class="form-group">

                <label>Custom Content 5</label>

                <textarea id="customContent5"></textarea>

            </div>

            <!-- SOCIAL -->

            <div class="form-group">

                <label>WhatsApp Number</label>

                <input type="text" id="whatsapp">

            </div>

            <div class="form-group">

                <label>LinkedIn Link</label>

                <input type="text" id="linkedin">

            </div>

            <div class="form-group">

                <label>GitHub Link</label>

                <input type="text" id="github">

            </div>

            <button class="btn" onclick="updateResume()">

                Update Resume

            </button>

            <button class="btn download-btn" onclick="downloadPDF()">

                Download PDF

            </button>

        </div>

        <!-- RESUME -->

        <div class="resume-wrapper" id="resume">

            <div class="resume template1" id="resumeTemplate">

                <!-- LEFT -->

                <div class="left">

                    <div class="profile-photo">

                        <img id="profileImage" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">

                    </div>

                    <div class="profile">

                        <h1 id="r-name">
                            Rameshwar Gaud
                        </h1>

                        <h3 id="r-profession">
                            Electrical Engineer
                        </h3>

                    </div>

                    <!-- CONTACT -->

                    <div class="section">

                        <h2>CONTACT</h2>

                        <p>

                            <b>Phone</b><br>

                            <span id="r-phone"></span>

                        </p>

                        <br>

                        <p>

                            <b>Email</b><br>

                            <span id="r-email"></span>

                        </p>

                        <br>

                        <p>

                            <b>Address</b><br>

                            <span id="r-address"></span>

                        </p>

                    </div>

                    <!-- SKILLS -->

                    <div class="section">

                        <h2>SKILLS</h2>

                        <ul id="r-skills"></ul>

                    </div>

                    <!-- SOCIAL -->

                    <div class="section">

                        <h2>SOCIAL</h2>

                        <div class="social-icons">

                            <a id="whatsappLink" target="_blank">

                                <i class="fab fa-whatsapp"></i>

                            </a>

                            <a id="linkedinLink" target="_blank">

                                <i class="fab fa-linkedin"></i>

                            </a>

                            <a id="githubLink" target="_blank">

                                <i class="fab fa-github"></i>

                            </a>

                        </div>

                    </div>

                </div>

                <!-- RIGHT -->

                <div class="right">

                    <div class="section">

                        <h2>PROFILE</h2>

                        <p id="r-summary"></p>

                    </div>

                    <!-- CUSTOM 1 -->

                    <div class="section" id="customSection1" style="display:none;">

                        <h2 id="r-customHeading1"></h2>

                        <p id="r-customContent1"></p>

                    </div>

                    <!-- CUSTOM 2 -->

                    <div class="section" id="customSection2" style="display:none;">

                        <h2 id="r-customHeading2"></h2>

                        <p id="r-customContent2"></p>

                    </div>

                    <!-- CUSTOM 3 -->

                    <div class="section" id="customSection3" style="display:none;">

                        <h2 id="r-customHeading3"></h2>

                        <p id="r-customContent3"></p>

                    </div>

                    <!-- CUSTOM 4 -->

                    <div class="section" id="customSection4" style="display:none;">

                        <h2 id="r-customHeading4"></h2>

                        <p id="r-customContent4"></p>

                    </div>

                    <!-- CUSTOM 5 -->

                    <div class="section" id="customSection5" style="display:none;">

                        <h2 id="r-customHeading5"></h2>

                        <p id="r-customContent5"></p>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

        // TEMPLATE SELECT

        function selectTemplate(template) {

            document.getElementById("main")
                .style.display = "flex";

            document.getElementById("templateSection")
                .style.display = "none";

            document.getElementById("resumeTemplate")
                .className = "resume " + template;

        }

        // UPDATE RESUME

        function updateResume() {

            document.getElementById("r-name")
                .innerText =
                document.getElementById("name").value;

            document.getElementById("r-profession")
                .innerText =
                document.getElementById("profession").value;

            document.getElementById("r-phone")
                .innerText =
                document.getElementById("phone").value;

            document.getElementById("r-email")
                .innerText =
                document.getElementById("email").value;

            document.getElementById("r-address")
                .innerText =
                document.getElementById("address").value;

            document.getElementById("r-summary")
                .innerText =
                document.getElementById("summary").value;

            // SKILLS

            let skills =
                document.getElementById("skills")
                    .value.split(",");

            let skillHTML = "";

            skills.forEach(skill => {

                skillHTML += `<li>${skill}</li>`;

            });

            document.getElementById("r-skills")
                .innerHTML = skillHTML;

            // CUSTOM SECTIONS

            for (let i = 1; i <= 5; i++) {

                let heading =
                    document.getElementById("customHeading" + i).value;

                let content =
                    document.getElementById("customContent" + i).value;

                if (heading !== "" || content !== "") {

                    document.getElementById("customSection" + i)
                        .style.display = "block";

                    document.getElementById("r-customHeading" + i)
                        .innerText = heading;

                    document.getElementById("r-customContent" + i)
                        .innerText = content;

                }

            }

            // WHATSAPP

            let whatsapp =
                document.getElementById("whatsapp").value;

            document.getElementById("whatsappLink")
                .href = "https://wa.me/" + whatsapp;

            // LINKEDIN

            document.getElementById("linkedinLink")
                .href =
                document.getElementById("linkedin").value;

            // GITHUB

            document.getElementById("githubLink")
                .href =
                document.getElementById("github").value;

        }

        // PHOTO

        document.getElementById("photoInput")
            .addEventListener("change", function (e) {

                const reader = new FileReader();

                reader.onload = function () {

                    document.getElementById("profileImage")
                        .src = reader.result;

                }

                reader.readAsDataURL(e.target.files[0]);

            });

        // DOWNLOAD PDF

        function downloadPDF() {

            const element =
                document.getElementById("resume");

            const options = {

                margin: 0,

                filename: 'Resume.pdf',

                image: {
                    type: 'jpeg',
                    quality: 1
                },

                html2canvas: {
                    scale: 2
                },

                jsPDF: {
                    unit: 'px',
                    format: [794, 1123],
                    orientation: 'portrait'
                }

            };

            html2pdf()
                .set(options)
                .from(element)
                .save();

        }

    </script>

</body>

</html>
